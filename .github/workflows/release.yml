name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: action-release
  cancel-in-progress: false

jobs:
  release:
    name: validate and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Validate stable version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag must be a stable semantic version (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PACKAGE_VERSION" != "$TAG" ]; then
            echo "package version $PACKAGE_VERSION does not match tag $TAG" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:ci
      - run: npm test
      - run: npm run bundle:check
      - run: npm run plugin:validate
      - run: npm run workflows:validate
      - run: npm pack --dry-run
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
      - name: Update matching major Action tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR=${TAG%%.*}
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR" --force
