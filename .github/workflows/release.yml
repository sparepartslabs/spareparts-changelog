name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: action-release
  cancel-in-progress: false

jobs:
  release:
    name: validate and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate stable version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag must be a stable semantic version (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PACKAGE_VERSION" != "$TAG" ]; then
            echo "package version $PACKAGE_VERSION does not match tag $TAG" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:ci
      - run: npm test
      - run: npm run bundle:check
      - run: npm run plugin:validate
      - run: npm run workflows:validate
      - run: npm pack --dry-run
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Resolve release range
        id: release-range
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/resolve-release-range.sh "$TAG" "$GITHUB_OUTPUT"
      - name: Resolve changelog object key
        id: changelog-object
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Assume changelog publisher role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CHANGELOG_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Render and publish end-user release notes
        id: changelog
        uses: sparepartslabs/spareparts-changelog@v0
        with:
          provider: anthropic
          instructions: ${{ vars.CHANGELOG_INSTRUCTIONS }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          from: ${{ steps.release-range.outputs.from }}
          to: ${{ steps.release-range.outputs.to }}
          title: ${{ github.ref_name }}
          write-repository: "false"
          publish-s3: "true"
          s3-bucket: ${{ vars.CHANGELOG_S3_BUCKET }}
          s3-key: releases/spareparts-changelog/${{ steps.changelog-object.outputs.version }}.md
          s3-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          publish-linkedin: "false"
      - name: Write canonical release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.markdown }}
        run: |
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --notes-file release-notes.md --title "$TAG"
      - name: Update matching major Action tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR=${TAG%%.*}
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR" --force
